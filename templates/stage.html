<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remidos em Cristo — Retorno de Palco | Confidence Monitor</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#080a0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Remidos Palco">
  <link rel="apple-touch-icon" href="/static/img/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/stage.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body class="stage-frame">

  <!-- TOP HEADER (~10% HEIGHT) -->
  <header class="stage-header">
    <div class="header-branding">
      <div class="brand-sacred-seal">
        <img src="/static/img/logo_transparent.png" alt="Remidos em Cristo" class="stage-church-logo" onerror="this.src='/static/img/logo.jpg'">
      </div>
      <div class="brand-titles">
        <div class="church-line">
          <span class="church-title">REMIDOS EM CRISTO</span>
          <span class="church-sep">•</span>
          <span class="sub-identity">NOVA ALIANÇA</span>
        </div>
        <div class="system-subline">
          <span class="monitor-caption">STAGE CONFIDENCE MONITOR</span>
          <div id="stage-status-badge" class="live-status-pill live">
            <span class="status-dot"></span>
            <span class="status-text">AO VIVO</span>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT HEADER: CLOCK & FULLSCREEN (TABLET / MONITOR) -->
    <div class="header-right-tools">
      <button id="stage-fullscreen-btn" class="stage-fs-button" title="Alternar Tela Cheia (Ideal para Tablet / Monitor)">
        <svg class="fs-icon enter" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <svg class="fs-icon exit" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
        </svg>
        <span class="fs-text">Tela Cheia</span>
      </button>

      <!-- DIGITAL PREACHER / ALTAR COUNTDOWN TIMER -->
      <div id="stage-timer-wrapper" class="header-timer" style="display: none;">
        <div id="stage-timer-label" class="timer-label">PREGAÇÃO</div>
        <div id="stage-timer-display" class="digital-timecode timer-timecode">40:00</div>
      </div>

      <!-- DIGITAL TIMECODE CLOCK -->
      <div class="header-clock">
        <div class="clock-label">HORÁRIO ATUAL</div>
        <div id="stage-clock" class="digital-timecode">00:00:00</div>
      </div>
    </div>
  </header>

  <!-- PRIVATE STAGE ALERT BANNER (ONLY ON STAGE) -->
  <div id="stage-alert-banner" class="stage-alert-banner" style="display: none;">
    <div class="alert-pulse-icon">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </div>
    <div class="alert-content">
      <span class="alert-tag">AVISO DA MESA:</span>
      <span id="stage-alert-text" class="alert-message">---</span>
    </div>
  </div>

  <!-- STAGE CONFIDENCE MONITORS WRAPPER (~90% HEIGHT) -->
  <main class="stage-monitors-body">
    
    <!-- CURRENT CUE: PROGRAM (NO TELÃO) - ~52% HEIGHT -->
    <section class="confidence-pane program-pane">
      <header class="pane-cue-bar">
        <div class="cue-tag-group">
          <span class="cue-pill program-pill">
            <span class="cue-indicator-dot program-dot"></span>
            <span class="cue-primary-title">PROGRAM</span>
          </span>
          <span class="cue-state-badge">NO TELÃO</span>
        </div>
        <div class="cue-title-group">
          <span id="stage-current-ref" class="cue-song-ref">Aguardando Projeção</span>
        </div>
      </header>

      <div class="pane-text-viewport">
        <div id="stage-current-text" class="pane-rendered-text program-rendered-text">
          Aguardando seleção no painel de transmissão...
        </div>
      </div>
    </section>

    <!-- NEXT CUE: NEXT (A SEGUIR) - ~34% HEIGHT -->
    <section class="confidence-pane next-pane">
      <header class="pane-cue-bar next-bar">
        <div class="cue-tag-group">
          <span class="cue-pill next-pill">
            <span class="cue-indicator-dot next-dot"></span>
            <span class="cue-primary-title">NEXT</span>
          </span>
          <span class="cue-state-badge next-state">A SEGUIR</span>
        </div>
        <div class="cue-title-group">
          <span id="stage-next-ref" class="cue-song-ref next-song-ref">---</span>
        </div>
      </header>

      <div class="pane-text-viewport next-viewport">
        <div id="stage-next-text" class="pane-rendered-text next-rendered-text">
          ---
        </div>
      </div>
    </section>

  </main>

  <script src="/static/js/stage.js"></script>
</body>
</html>
